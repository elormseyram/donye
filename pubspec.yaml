name: donye
description: SheRides Telemetry — Smart electric bike monitoring for riders.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  http: ^1.6.0

  # Ambient weather location
  geolocator: ^14.0.2

  # IoT / MQTT
  mqtt_client: ^10.4.0

  # Backend / Auth / Realtime
  supabase_flutter: ^2.8.4

  # Local Storage / Caching
  hive_flutter: ^1.1.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Functional Error Handling
  dartz: ^0.10.1

  # Secure Token Storage
  flutter_secure_storage: ^9.2.4

  # Push / Local Notifications
  flutter_local_notifications: ^17.2.4

  # Charts
  fl_chart: ^0.69.2

  # Maps
  google_maps_flutter: ^2.9.0

  # Network Connectivity
  connectivity_plus: ^6.1.3

  # Animations / Assets
  lottie: ^3.3.3
  flutter_native_splash: ^2.4.5

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  logger: ^2.5.0
  rxdart: ^0.28.0
  geolocator: ^14.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  injectable_generator: ^2.7.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.4
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/animations/

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
